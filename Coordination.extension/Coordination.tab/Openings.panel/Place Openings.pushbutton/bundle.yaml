title: Поставити отвори
tooltip: |
  Ставить отвори там, де «Clash у зоні» (краще в режимі «План отворів») знайшов прохід труби крізь стіну
  чи плиту без отвору. Для труб: кругле сімейство «פתח למערכות עגול», найменший тип, у який проходить
  труба, на грані стіни / плити з лінку, на воркcеті Openings. Спершу показує список, ставить після
  підтвердження. Clash Region лишаються.
