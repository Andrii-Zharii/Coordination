title: Copy from Link
tooltip: "Відкрийте вид і натисніть. 1) Видаляє з виду всі старі елементи на ворксеті PL. 2) Копіює з лінка PL усе, що видно на цьому виді, і вставляє на ворксет PL. Спочатку покаже кількість і спитає. Перший раз спитає ворксет і лінк; Shift+Click — вибрати інші."
