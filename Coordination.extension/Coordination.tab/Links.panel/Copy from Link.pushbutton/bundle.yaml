title: Copy from Link
tooltip: "Відкрийте план поверху і натисніть. 1) Видаляє з виду всі старі елементи на ворксеті PL. 2) Копіює з лінка PL усе, що видно на цьому виді, і вставляє на ворксет PL. Стояки через кілька поверхів не чіпає — порівнює їх з лінком і показує, які зсунулись. Shift+Click — вибрати інший лінк або ворксет."
