title: Move Set
tooltip: "Виділіть трубу (повітропровід, лоток, кабелепровід), натисніть і оберіть зсув: по горизонталі або по вертикалі. Виділиться вся мережа, яка посунеться разом з нею: фітинги, арматура, відгалуження — до труб, що змінюють напрямок (вони розтягнуться). Section box 3D-виду підлаштується під неї."
