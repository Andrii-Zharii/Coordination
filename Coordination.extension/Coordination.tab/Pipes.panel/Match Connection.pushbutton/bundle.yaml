title: Match Connection
tooltip: З'єднує дві нез'єднані труби так само, як з'єднання-зразок. Виділіть зразок (відвід, два відводи зміщення, трійник, врізку або перехід), потім клікайте пари труб біля кінців, які треба з'єднати. Esc — завершити.
