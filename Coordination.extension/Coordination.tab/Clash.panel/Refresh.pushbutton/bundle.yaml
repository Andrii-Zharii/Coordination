title: Оновити групу
tooltip: |
  Перевіряє ще раз тільки поточну групу (відкриту кнопками Наступна / Список): шукає колізії в її місці
  з налаштуваннями останнього «Clash у зоні». Вирішені колізії зникають разом зі своїми боксами Clash Region;
  якщо не лишилось жодної - група позначається «вирішено», і Наступна / Попередня її пропускають.
