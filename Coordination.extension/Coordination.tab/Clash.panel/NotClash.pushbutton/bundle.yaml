title: Не колізія
tooltip: |
  Позначити поточну групу (або обрану в Списку колізію) як «не колізія»: проблема з'єднання,
  так задумано тощо. Її бокси Clash Region прибираються, Наступна / Попередня її пропускають,
  і наступні перевірки її більше не показують. Список спільний для команди: cases/<модель>/ignored.json.
  Shift+клік: повернути колізії зі списку.
author: Coordination
context: doc-project
