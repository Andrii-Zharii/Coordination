title: Fix Worksets
tooltip: "Відкрийте план поверху і натисніть. Для кожної мережі поверху (елементи, з'єднані між собою) знаходить основний ворксет — той, на якому більшість її елементів, і показує елементи на інших ворксетах. Після підтвердження переносить їх на основний. Ворксети -DC не чіпає."
